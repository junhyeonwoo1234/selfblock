name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir app
          unzip -q SelfBlock_FlutLab.zip -d app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        working-directory: app
        run: |
          flutter create --platforms=android --org com.example --project-name selfblock .
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SelfBlock-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
